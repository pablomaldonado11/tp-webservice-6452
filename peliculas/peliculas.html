<div class="container py-4 bg-dark text-light min-vh-100">
  <div class="mb-4">
    <h2 class="fw-bold text-warning text-uppercase">Lista de Películas Recomendadas</h2>
    <hr class="border-secondary">
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 px-2">
    <div class="col" *ngFor="let peli of listaPeliculas">
      <div class="card h-100 bg-secondary bg-opacity-10 text-light border-secondary shadow">
        
        <img *ngIf="peli.image" [src]="peli.image" class="card-img-top" [alt]="peli.title" style="height: 250px; object-fit: cover;">
        
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title fw-bold text-warning mb-1">
              {{ peli.title }} <span class="text-muted small" *ngIf="peli.year">({{ peli.year }})</span>
            </h5>
            <p class="card-text text-muted small">
              <strong>Sinopsis:</strong> {{ peli.description }}
            </p>
          </div>

          <div class="d-flex flex-wrap gap-1 align-items-center mt-2" *ngIf="peli.genre">
            <span class="small text-muted me-1">Gén:</span>
            <span *ngFor="let g of peli.genre" class="badge bg-warning text-dark rounded-pill small">
              {{ g }}
            </span>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
