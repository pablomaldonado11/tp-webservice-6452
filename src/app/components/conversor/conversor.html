<div class="conversor-card">
    <div class="conversor-header">
      Conversor De Divisas
    </div>
  
    <div class="conversor-body">
      <div class="form-group">
        <label>Cantidad</label>
        <input [(ngModel)]="cantidad" type="number" placeholder="Cantidad">
      </div>
  
      <div class="form-group">
        <label>De</label>
        <select [(ngModel)]="de">
          <option value="USD">USD Dólares EEUU</option>
          <option value="ARS">ARS Pesos Argentinos</option>
          <option value="EUR">EUR Euros</option>
        </select>
      </div>
  
      <div class="form-group">
        <label>A</label>
        <select [(ngModel)]="a">
          <option value="ARS">ARS Pesos Argentinos</option>
          <option value="USD">USD Dólares EEUU</option>
          <option value="EUR">EUR Euros</option>
        </select>
      </div>
  
      <div class="form-group">
        <input type="text" [value]="resultado !== null ? (resultado | number:'1.2-2') : ''" readonly class="resultado-input">
      </div>
  
      <button (click)="realizarConversion()" class="btn-convertir">
        Convertir <span>→</span>
      </button>
    </div>
  </div>
