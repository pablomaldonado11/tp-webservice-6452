<div class="valorant-container">

  <div class="valorant-header">

    <h2>
      🏆 Valorant Esports
    </h2>

  </div>

  <!-- PARTIDOS -->

  <div class="partidos-list">

    <div
      *ngFor="
        let partido of partidos
      "
      class="partido-card">

      <!-- INFO -->

      <div class="partido-info">

        <span class="liga">

          {{
            partido.league?.name
            || 'Liga Valorant'
          }}

        </span>

        <span class="fecha">

          {{
            partido.date
            | date:'short'
          }}

        </span>

      </div>

      <!-- EQUIPOS -->

      <div class="matchup">

        <!-- TEAM 1 -->

        <div class="equipo">

          <img
            [src]="
              partido.teams?.[0]?.image
            "
            class="logo-team">

          <span
            class="nombre-equipo">

            {{
              partido.teams?.[0]?.name
              || 'Equipo A'
            }}

          </span>

        </div>

        <!-- VS -->

        <div class="vs">

          VS

        </div>

        <!-- TEAM 2 -->

        <div class="equipo">

          <span
            class="nombre-equipo">

            {{
              partido.teams?.[1]?.name
              || 'Equipo B'
            }}

          </span>

          <img
            [src]="
              partido.teams?.[1]?.image
            "
            class="logo-team">

        </div>

      </div>

    </div>

  </div>

  <!-- PAGINACION -->

  <div class="paginacion">

    <button
      (click)="
        cambiarPagina(false)
      "
      [disabled]="
        paginaActual === 1
      ">

      Anterior

    </button>

    <span>

      Página
      {{ paginaActual }}

    </span>

    <button
      (click)="
        cambiarPagina(true)
      ">

      Siguiente

    </button>

  </div>

</div>
